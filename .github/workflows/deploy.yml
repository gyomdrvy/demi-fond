
name: Publier Demi-fond Troisieme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances
        run: npm install

      - name: Compiler l'application
        run: npm run build

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer les fichiers compiles
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./dist

      - name: Attendre la disponibilite du fichier de publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ] 2>/dev/null; then exit 0; fi
            sleep 10
          done
          echo 'Artifact github-pages introuvable apres attente.'
          exit 1

      - name: Publier l'application
        id: deployment
        uses: actions/deploy-pages@v4
